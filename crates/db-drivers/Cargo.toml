[package]
name = "db-drivers"
version = "0.1.0"
edition = "2021"

[dependencies]
db-core = { path = "../db-core" }
# `resp`'s RESP argv tokenizer + read-only command table (redis.rs) and
# `mongo`'s sugar parser (mongodb.rs) — both pure/Qt-free/tokio-free, so
# they live in `db-sql` alongside `split`/`classify` rather than being
# re-implemented here (F7.2/F7.3).
db-sql = { path = "../db-sql" }
# The private `"db-io"` runtime every async driver's calls are `block_on`'d
# against (ADR-0058 §1) — never the ambient kind, and never reached by
# SQLite/Redis, which bypass it entirely (both have synchronous APIs).
tokio = { version = "1", features = ["rt-multi-thread"] }

# SQLite: `bundled` links its own vendored C sqlite3 rather than a system
# package, the same "the build itself never depends on one being present"
# reasoning `secret-store`'s `linux-native` keyring backend already uses.
# Synchronous — bypasses the tokio runtime entirely.
rusqlite = { version = "0.32", features = ["bundled"], optional = true }

# PostgreSQL: async, `block_on`'d against the private runtime above.
# `rustls`'s `ring` provider only (never `aws-lc-rs`, ADR-0061 §2/R2) —
# `default-features = false` on every crate in this chain is what keeps
# `aws-lc-rs` out; see F1.7's `cargo tree -i aws-lc-rs` gate.
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-uuid-1"], optional = true }
tokio-postgres-rustls = { version = "0.13", default-features = false, optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"], optional = true }
bytes = { version = "1", optional = true }
uuid = { version = "1", optional = true }

[features]
# `cassandra` is deliberately left out of `default` — see the `[dependencies.scylla]`
# comment below: its own manifest cannot be told to skip `aws-lc-rs`, so pulling
# it into every default build would fail the workspace-wide
# `cargo tree -i aws-lc-rs` gate (ADR-0061 §2) for every consumer, not just the
# opt-in few who need Cassandra/Scylla today.
default = ["sqlite", "postgres", "mongodb", "redis", "ssh"]
sqlite = ["dep:rusqlite"]
postgres = ["dep:tokio-postgres", "dep:tokio-postgres-rustls", "dep:rustls", "dep:bytes", "dep:uuid"]
mongodb = ["dep:mongodb-driver", "dep:bson", "dep:futures-util", "dep:serde_json"]
redis = ["dep:redis-driver"]
cassandra = ["dep:scylla"]
ssh = ["dep:russh"]
# Gates the real-server tests in `postgres.rs`/`mongodb.rs`/`redis.rs`/
# `cassandra.rs`/`ssh.rs` (env `IDE_DB_*_URL`/`IDE_DB_SSH_*`).
# `make test`/`cargo test --workspace` never builds this feature —
# `db-integration.md` runs it separately, the same shape `jvm-integration`
# already uses for `jvm-build-core`.
db-integration = []

# MongoDB: async, `block_on`'d against the private runtime above, same as
# `postgres` — never the crate's own `sync` feature, which would spin a
# second, unmanaged tokio runtime of its own.
#
# R11 spike (database-tools-plan.md §13): 3.9.1's default `bson-2` feature
# fails to compile under rustc 1.98.1 with E0659 ("`doc` is ambiguous") —
# a name collision between the re-exported `bson::doc!` macro and the
# built-in `#[doc]` attribute inside `mongodb`'s own `macro_magic`-based
# `#[options_doc]`/`#[export_doc]` plumbing (`action/search_index.rs`).
# Switching to the `bson-3` feature (bson 3.x, whose `doc!` macro no
# longer collides) avoids it entirely — no crate downgrade needed.
# `compat-3-3-0` is 3.9.1's own required forward-compat marker feature
# (a hard `compile_error!` without it, unrelated to R11).
[dependencies.mongodb-driver]
package = "mongodb"
version = "3.9.1"
default-features = false
features = ["rustls-tls", "dns-resolver", "bson-3", "compat-3-3-0"]
optional = true

[dependencies.bson]
version = "3"
features = ["serde"]
optional = true

[dependencies.serde_json]
version = "1"
optional = true

# `TryStreamExt::try_next` to drain a `mongodb::Cursor` (a `Stream`) inside
# `block_on` — already in the dependency graph transitively via `mongodb`
# itself, named explicitly since `mongodb.rs` uses it directly.
[dependencies.futures-util]
version = "0.3"
default-features = false
features = ["std"]
optional = true

# Redis: synchronous, bypasses the private runtime entirely (same as
# `rusqlite`) — the `redis` crate's blocking API needs nothing from tokio.
# `tls-rustls` gates rustls (never `tls-native-tls`/openssl).
[dependencies.redis-driver]
package = "redis"
version = "0.27"
default-features = false
features = ["tls-rustls"]
optional = true

# Cassandra/Scylla: async, `block_on`'d against the private runtime.
#
# Unlike postgres/mongodb/redis above, this one CANNOT be kept clean of
# `aws-lc-rs`: scylla 1.9.0's own `Cargo.toml` declares
# `rustls = { version = "0.23", optional = true }` and
# `tokio-rustls = { version = "0.26", optional = true }` with no
# `default-features = false` on either — verified straight from the
# published `Cargo.toml.orig` for 1.9.0 (and reproduced identically on
# 1.8.0 and 1.7.0, the next two releases down). Cargo's feature
# unification then turns rustls's default `aws_lc_rs` crypto-provider
# feature on for the one shared `rustls` v0.23 instance in the graph
# regardless of what THIS crate's own `rustls` dependency (see `postgres`
# above, `default-features = false` + `ring` only) asks for — there is no
# per-dependent feature override in Cargo, only a union across the whole
# graph. The only real fix is a `[patch]`-vendored fork of scylla's
# manifest, which pulls in its whole cargo workspace (`readme =
# "../README.md"` ties it to sibling crates) for a one-line change —
# disproportionate to what F7.4 needs. Left as a known, upstream-caused
# gap: `cassandra` stays opt-in (not in `default`, see above) so the
# workspace's normal build and `cargo tree -i aws-lc-rs` gate stay clean;
# `cargo tree --all-features -i aws-lc-rs` will still show it, sourced
# only from `scylla`'s own manifest — see the final report for the full
# `cargo tree` output and this same note in `database-tools-plan.md`'s
# F7.4 row.
[dependencies.scylla]
version = "1.9"
default-features = false
features = ["rustls-023"]
optional = true

# `RusshTunnel` (F7.5): the in-process SSH tunnel `db_core::tunnel::select`
# falls back to when `ssh` is not on `PATH`, or the auth mode is a
# password (`ssh -o BatchMode=yes` cannot prompt for one). `ring` only,
# `default-features = false` drops the crate's own default `aws-lc-rs`
# feature — unlike `scylla` above, russh's manifest genuinely lets a
# dependent choose (`aws-lc-rs`/`ring` are each their own named feature,
# neither implied by the other). `rsa` keeps RSA host/user keys
# supported — still the most common key type in the wild even though this
# codebase would default to Ed25519 for anything it generates itself.
# `russh-keys` is not a separate dependency in 0.63: known-hosts checking,
# key loading and the SSH-agent client all live in `russh::keys`, part of
# this one crate.
[dependencies.russh]
version = "0.63"
default-features = false
features = ["ring", "rsa"]
optional = true

[dev-dependencies]
tempfile = "3"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
uuid = { version = "1", features = ["v4"] }
