# linuxserver/openssh-server ships `AllowTcpForwarding no`; the tunnel test
# needs a `direct-tcpip` channel to `postgres:5432`. Mounted at
# /config/sshd/sshd_config.d/, which the image's init script Includes at the
# top of sshd_config — sshd takes the first match, so this wins.
AllowTcpForwarding yes
