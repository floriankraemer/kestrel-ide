[package]
name = "lsp-core"
version = "0.1.0"
edition = "2021"

[dependencies]
# Content-Length framing, shared with `dap-core` (ADR-0041).
stdio-framing = { path = "../stdio-framing" }
# The one Problems model (ADR-0046): `publish_diagnostics` converts a
# server's `lsp_types::Diagnostic`s into `diagnostics_core::Diagnostic` at
# ingest, and `path_from_uri`/`uri_from_path` now live there too.
diagnostics-core = { path = "../diagnostics-core" }
# F3-15: the refactor-preview dialog's diff panel needs `editor_core::diff`
# to turn a pending `DocumentEdits`' before/after text into hunks. See
# `docs/architecture/layering.md`'s `lsp-core` row.
editor-core = { path = "../editor-core" }
lsp-types = "0.97"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# C5: glob-matching for `workspace/didChangeWatchedFiles` registrations
# (`watched_files::WatchedFiles`). Already in the dependency tree
# transitively via `ignore` in other crates; declared directly here since
# this is the first crate that calls into it.
globset = "0.4"
# C5: `FileChangeKind::from(notify::EventKind)` reuses
# `project_model::watcher`'s event classification without depending on
# `project-model` itself — `lsp-core` stays free of the domain crate, and
# picks up only the wire-format enum it maps from.
notify = "6"
# C9: `semantic_tokens::overlay` merges a server's semantic-token spans onto
# `syntax_core::HighlightSpan`s, and the scope a token type/modifier maps to
# is resolved through `syntax_core::Scope`'s own dotted fallback walk rather
# than a second copy of it — see ADR-0035. This is a normal, not dev-only,
# dependency now: ADR-0018 kept `syntax-core` dev-only because *which
# language a file is* must have one source of truth, but combining two
# already-classified span lists is a different question than that one, and
# reintroduces no duplication.
syntax-core = { path = "../syntax-core" }

[dev-dependencies]
# Conformance suite only: a temp cargo project for a real server to index,
# and the expectations file it asserts against.
tempfile = "3"
toml = "0.8"

[[bin]]
name = "stub_server"
path = "src/bin/stub_server.rs"
