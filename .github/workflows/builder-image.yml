# The gates run inside the same Docker images developers use locally
# (docker/Dockerfile, per CLAUDE.md), so CI cannot drift from the dev
# environment. This workflow publishes one stage of that Dockerfile to GHCR
# and hands the caller its image reference; it is a layer-cache hit and takes
# seconds unless docker/Dockerfile actually changed.
name: Builder image

on:
  workflow_call:
    inputs:
      target:
        description: Dockerfile stage to build (linux-builder or lsp-conformance)
        type: string
        default: linux-builder
    outputs:
      image:
        description: Pushed image reference
        value: ${{ jobs.build.outputs.image }}

jobs:
  build:
    name: Build ${{ inputs.target }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.ref.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image reference
        id: ref
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/$owner/ide-${{ inputs.target }}:${{ hashFiles('docker/Dockerfile') }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A pull request from a fork runs with a read-only GITHUB_TOKEN, so it
      # cannot push to GHCR. Such a run reuses the image main already
      # published for this Dockerfile -- the tag is the Dockerfile's hash, and
      # the package is public, so a pull needs no write access. A fork PR that
      # edits docker/Dockerfile has no image to reuse and fails on the check
      # below with an explicit message.
      - uses: docker/build-push-action@v6
        if: ${{ !github.event.pull_request.head.repo.fork }}
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ inputs.target }}
          push: true
          tags: ${{ steps.ref.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Reuse the published image (fork pull request)
        if: ${{ github.event.pull_request.head.repo.fork }}
        run: |
          image="${{ steps.ref.outputs.image }}"
          if ! docker manifest inspect "$image" > /dev/null 2>&1; then
            echo "::error::$image is not published. A pull request from a fork cannot build it, because its GITHUB_TOKEN cannot write packages. Rebase onto a main whose docker/Dockerfile is unchanged by this branch, or have a maintainer push the branch to this repository."
            exit 1
          fi
