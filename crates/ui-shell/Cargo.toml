[package]
name = "ui-shell"
version = "0.1.0"
edition = "2021"

[dependencies]
app-core = { path = "../app-core" }
app-config = { path = "../app-config" }
settings-model = { path = "../settings-model" }
editor-core = { path = "../editor-core" }
# The language-aware half of the editing operations (comment toggle, expand
# selection, indent, bracket pairing): it needs the text and the grammar at
# once, which is the join `edit-ops` exists to hold so the adapter does not.
edit-ops = { path = "../edit-ops" }
project-model = { path = "../project-model" }
syntax-core = { path = "../syntax-core" }
markdown-preview = { path = "../markdown-preview" }
index-core = { path = "../index-core" }
lsp-core = { path = "../lsp-core" }
# The one Problems model (ADR-0046): the shared store `DiagnosticsService`,
# `LanguageService` and `BuildService` all read and write.
diagnostics-core = { path = "../diagnostics-core" }
# Git v1 (F3-12): repository discovery, status, hunks, staging, commit,
# branches, remotes, history and blame — `VcsService` is a thin worker-thread
# adapter over this crate's own types, never `gix`/`git` directly.
vcs-core = { path = "../vcs-core" }
pty-core = { path = "../pty-core" }
terminal-core = { path = "../terminal-core" }
# Run configurations and console (F4): the configuration model, detection,
# process supervision and output batching, and the file:line link catalogue
# — `RunService`/`RunConfigEditor` are thin adapters over this crate's own
# types, never `pty-core` directly.
run-core = { path = "../run-core" }
# B1-6: the Build dock and the Problems dock's build rows.
build-core = { path = "../build-core" }
# D3: the debugger.
dap-core = { path = "../dap-core" }
mcp-server = { path = "../mcp-server" }
ai-chat-core = { path = "../ai-chat-core" }
# The Plugins page: scanning for the page (which must see the plugins the
# live registry has already dropped) and choosing the host services the wasm
# tier runs with — an implementation of which will be a Qt object, so this is
# the crate that picks one.
plugin-host = { path = "../plugin-host" }
# The agent's tool arguments and results are `serde_json::Value`s
# (`ai_chat_core::tools::ToolCall`), so the seam has to read and write them.
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
cxx = "1"
cxx-qt = "0.9"
cxx-qt-lib = "0.9"

[build-dependencies]
cxx-qt-build = "0.9"
