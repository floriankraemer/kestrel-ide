[package]
name = "db-driver-adbc"
version = "0.1.0"
edition = "2021"

[dependencies]
db-core = { path = "../db-core" }
chrono = "0.4"
adbc_core = "0.24"
adbc_driver_manager = "0.24"
# `default-features = false`: this crate only ever converts a `RecordBatch`
# it already has (`arrow.rs`, the only Arrow code in the workspace) — it
# never needs Arrow's compute kernels, IPC, or Parquet machinery.
arrow-array = { version = "59", default-features = false }
arrow-schema = { version = "59", default-features = false }
# Blocking HTTP on a `std::thread`, the exact feature set `container-registry`
# already pulls (`rustls-tls`, not `native-tls`, so the MXE Windows
# cross-build never vendors OpenSSL). reqwest's blocking client carries its
# own private tokio runtime — tolerated the same way `container-registry`'s
# is (layering.md).
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
sha2 = "0.11"
tar = "0.4"
flate2 = "1"
zip = { version = "8", default-features = false, features = ["deflate"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
dirs = "5"

[dev-dependencies]
tempfile = "3"
arrow-buffer = { version = "59", default-features = false }
