[package]
name = "app"
version = "0.1.0"
edition = "2021"

[dependencies]
ui-shell = { path = "../ui-shell" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_Shell"] }

[build-dependencies]
# Only actually invoked on the windows target (see build.rs); winres shells
# out to `windres`/`rc.exe` rather than linking anything, so it costs nothing
# on the Linux host build.
winres = "0.1"

# The E2E harness lives in `crates/e2e` but its tests live here, because
# `CARGO_BIN_EXE_app` is only set for integration tests of the crate that
# declares the binary — and guessing at `target/<profile>/app` is wrong under
# every profile but one (see `lsp-core/tests/stub_server_session.rs:15`).
# `app-config` is the one workspace crate a test may read: the window-state
# flow must parse the persisted TOML with the app's own types rather than a
# regex, or it asserts against its own re-implementation.
[dev-dependencies]
e2e = { path = "../e2e" }
app-config = { path = "../app-config" }
serde_json = "1"
# Only for `git_fixture`: a Git repository baked in before `Ide::launch`
# spawns the app, so `VcsService::open_project`'s own background discovery
# thread sees `.git` from the first instant rather than racing a `git init`
# run after the process is already up.
tempfile = "3"
# Only for `e2e_vcs.rs`'s `forget_dock_in_saved_layout`: the persisted dock layout is ADS's
# `qCompress`ed XML, base64'd through `window_state`.
base64 = "0.22"
flate2 = "1"
