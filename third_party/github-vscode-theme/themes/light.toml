id = "github-light"
label = "GitHub Light"
appearance = "light"

[chrome]
canvas = "#ffffffff"
surface = "#ffffffff"
surface2 = "#f6f8faff"
raised = "#ebf0f4ff"
border = "#e1e4e8ff"
text = "#24292eff"
text_dim = "#6a737dff"
accent = "#2188ffff"
accent_ink = "#ffffffff"
selection = "#e2e5e9ff"
