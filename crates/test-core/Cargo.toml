[package]
name = "test-core"
version = "0.1.0"
edition = "2021"

[dependencies]
# A failing assertion becomes a `diagnostics_core::Diagnostic` the same way
# an analyzer finding does (D3): one Problems model, not a second one for
# tests.
diagnostics-core = { path = "../diagnostics-core" }
# `process_exec::spawn`: pipes, not a PTY, for the same reason analyzers
# avoid one (a tty hard-wraps output, fatal to a TeamCity service message
# split mid-line), and streamed rather than collected-to-completion like
# `process_exec::run`, so the tree fills while the run is in flight.
process-exec = { path = "../process-exec" }
# `TestFrameworkContribution`: the declarative manifest shape a run is
# built from.
plugin-api = { path = "../plugin-api" }
quick-xml = "0.41"
# `report_glob` (the `junit-xml` output format's post-run file glob,
# ADR-0057 C1): matching `**/target/{surefire,failsafe}-reports/TEST-*.xml`
# against a walked `work_dir` needs brace-alternate glob syntax, not a
# hand-rolled matcher.
globset = "0.4"

[dev-dependencies]
tempfile = "3"

[features]
# Gates `tests/jvm_integration.rs`, which shells out to the real `gradle`/
# `mvn` binaries `linux-jvm` ships against jvm-build-core's fixture projects
# (jvm-build-tools plan C2, ADR-0057) — never enabled by
# `cargo test --workspace`/`make test`, only `make test-jvm`.
jvm-integration = []
