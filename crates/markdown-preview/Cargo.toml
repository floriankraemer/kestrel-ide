[package]
name = "markdown-preview"
version = "0.1.0"
edition = "2021"

[dependencies]
comrak = "0.54"
# Native renderer behind the built-in Carve preview contribution
# (ADR-0054), the same shape as comrak behind Markdown: a rendering
# engine belongs here, never in the application layer.
carve-lang = "0.1.5"
syntax-core = { path = "../syntax-core" }
resvg = { version = "0.45", default-features = false, features = ["text"] }
merman = { version = "=0.7.0-alpha.1", default-features = false, features = ["render"] }
merman-core = "=0.7.0-alpha.1"
merman-render = "=0.7.0-alpha.1"
dugong = "=0.7.0-alpha.1"
dugong-graphlib = "=0.7.0-alpha.1"
manatee = "=0.7.0-alpha.1"
regex-lite = "0.1"

[dev-dependencies]
tempfile = "3"
