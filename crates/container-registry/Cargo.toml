[package]
name = "container-registry"
version = "0.1.0"
edition = "2021"

[dependencies]
# `ImageRef::hub_repository` decides which Hub repository a typed prefix
# names; the pure DTO the answers are parsed into (`completion::HubRepo`)
# lives there too, so the ranking stays network-free.
container-core = { path = "../container-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Blocking HTTP on a `std::thread`, the same feature set `ai-chat-core`
# pulls (`rustls-tls`, not `native-tls`, so the MXE Windows cross-build
# never vendors OpenSSL). reqwest's blocking client carries its own private
# tokio runtime, which is why this is its own crate: `container-core` sits
# under `run-core`, `build-core` and `dap-core`, whose layering gate
# forbids tokio anywhere in their tree.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
# C7's credential store (`secrets.rs`). `linux-native` (kernel keyutils,
# the pure-Rust `linux-keyutils` crate) rather than `sync-secret-service`/
# `linux-native-sync-persistent` (both pull in D-Bus's `dbus-secret-service`,
# which needs `libdbus-1-dev` + `pkg-config` just to *compile*): the
# linux-builder image, CI, and a minimal desktop all lack a running D-Bus
# Secret Service daemon (ADR-0021 already rejected `keyring` for
# `ai-chat-core` on exactly this), and `linux-native` needs no system
# package at all, so the build itself never depends on one being present.
# `secrets.rs`'s own "unavailable" mapping is what still makes a
# fully locked-down sandbox (keyutils syscalls themselves blocked) degrade
# to the documented `docker login` fallback instead of erroring.
keyring = { version = "3", default-features = false, features = ["linux-native", "windows-native", "apple-native"] }
