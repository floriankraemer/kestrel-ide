[package]
name = "app-core"
version = "0.1.0"
edition = "2021"

[dependencies]
editor-core = { path = "../editor-core" }
project-model = { path = "../project-model" }
# The icon-theme join (ADR-0026): the host stores contributions, `icon-theme`
# reads packs, `syntax-core` answers which language a file is, and none of
# the three may depend on the others. All Qt-free, so `app-core`'s no-Qt rule
# is untouched.
icon-theme = { path = "../icon-theme" }
plugin-host = { path = "../plugin-host" }
syntax-core = { path = "../syntax-core" }
# The colour-theme join (ADR-0026, color-themes plan T6), same shape as the
# icon-theme join above: the host stores contributions, `color-theme` parses
# a theme file, neither may depend on the other. Qt-free, so app-core's
# no-Qt rule is untouched.
color-theme = { path = "../color-theme" }
# The previews join (ADR-0033), the same shape as the icon-theme join
# above: the host stores contributions, `markdown-preview` renders,
# neither may depend on the other. Qt-free, so app-core's no-Qt rule is
# untouched.
markdown-preview = { path = "../markdown-preview" }
# The project-tree source-root/output-dir decoration join (jvm-build-tools
# plan B7, ADR-0057): `jvm-build-core` owns the synced `BuildModel`,
# `icon-theme` owns the icon pack, neither depends on the other. Qt-free,
# so app-core's no-Qt rule is untouched.
jvm-build-core = { path = "../jvm-build-core" }

[dev-dependencies]
tempfile = "3"
