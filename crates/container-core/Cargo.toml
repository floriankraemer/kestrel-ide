[package]
name = "container-core"
version = "0.1.0"
edition = "2021"

[dependencies]
process-exec = { path = "../process-exec" }
app-config = { path = "../app-config" }
pty-core = { path = "../pty-core" }
# C6: compose services/lines over tree-sitter-yaml through the one registry
# (ADR-0018); `tree-sitter` is the same runtime `syntax-core` is built
# against, a node tree cannot cross two of them (the `edit-ops` precedent).
syntax-core = { path = "../syntax-core" }
tree-sitter = "0.26"
# C6: Docker Hub search/tags for image-name completion — the same feature
# set `ai-chat-core` already pulls, so no second TLS stack enters the tree.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
