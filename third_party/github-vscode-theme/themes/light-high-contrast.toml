id = "github-light-high-contrast"
label = "GitHub Light High Contrast"
appearance = "light"

[chrome]
canvas = "#ffffffff"
surface = "#ffffffff"
surface2 = "#ffffffff"
raised = "#e7ecf0ff"
border = "#20252cff"
text = "#0e1116ff"
text_dim = "#0e1116ff"
accent = "#0349b4ff"
accent_ink = "#ffffffff"
selection = "#eef0f2ff"
status_bar = "#ffffffff"

[semantic]
error = "#f14c4cff"
warning = "#cca700ff"
info = "#3794ffff"
ok = "#024c1aff"
muted = "#0e1116ff"

[diff]
added_line = "#d9f7dfff"
added_inline = "#a1e2b1ff"
added_marker = "#055d20ff"
modified_line = "#1e2f4aff"
modified_inline = "#2d4a70ff"
modified_marker = "#744500ff"
deleted_line = "#ffecebff"
deleted_inline = "#f8bdbeff"
deleted_marker = "#a0111fff"

[terminal]
black = "#0e1116ff"
red = "#a0111fff"
green = "#024c1aff"
yellow = "#3f2200ff"
blue = "#0349b4ff"
magenta = "#622cbcff"
cyan = "#1b7c83ff"
white = "#66707bff"
bright_black = "#4b535dff"
bright_red = "#86061dff"
bright_green = "#055d20ff"
bright_yellow = "#4e2c00ff"
bright_blue = "#1168e3ff"
