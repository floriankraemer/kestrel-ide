# F8.3/F8.4 spike data (database-tools-plan.md F8.3, database-tools.md
# §11): one row per ADBC driver looked at, with a pinned artifact per
# platform where a stable `https://` URL + published checksum exists, or
# an `install-hint` where it doesn't. See F8b for turning the pinnable
# rows into `builtin/database-tools/plugin.toml` entries.
#
# No binaries are committed here — every `sha256` was computed once by
# downloading the artifact during the spike (PyPI itself publishes and
# serves a sha256 per file for the two wheel-distributed drivers; DuckDB's
# GitHub release assets carry no published checksum of their own, so that
# hash is one this repository computed and now pins against future
# corruption/tampering, not one DuckDB vouches for).
#
# `library` is the exact path of the shared library *inside* the
# downloaded archive (`install_from_bytes` looks it up by that path).
# `entrypoint` is the C symbol the driver manager calls to initialize the
# driver; every artifact below verified to export the ADBC-standard
# `AdbcDriverInit` symbol (checked via `nm`/string-scan during the spike),
# so a per-driver override is not needed.

[[driver]]
id = "duckdb"
name = "DuckDB"
family = "duckdb"
manifest-name = "duckdb"
entrypoint = "duckdb_adbc_init"

# DuckDB's own C API is the ADBC entrypoint (not a separate
# apache/arrow-adbc driver) and exports `duckdb_adbc_init`, confirmed
# against DuckDB's `adbc.h` header shipped in the same release archive.
[driver.artifacts.linux_amd64]
url = "https://github.com/duckdb/duckdb/releases/download/v1.5.5/libduckdb-linux-amd64.zip"
sha256 = "1fb8ce388157d84a25abe685a8a2520bf00c00321821968e4bb398fd766e7abb"
library = "libduckdb.so"

[driver.artifacts.windows_amd64]
url = "https://github.com/duckdb/duckdb/releases/download/v1.5.5/libduckdb-windows-amd64.zip"
sha256 = "8375eb1fcf2212e8a0817950354815d4dde9dd383c2d9fa7b8975b71e278c1bd"
library = "duckdb.dll"

[[driver]]
id = "snowflake"
name = "Snowflake"
family = "snowflake"
manifest-name = "snowflake"
entrypoint = "AdbcDriverInit"

# Official `apache/arrow-adbc` driver, published as a Python wheel whose
# only payload worth extracting is the shared library — the wheel itself
# is just a zip. Both platform wheels bundle a `.so`-suffixed library
# (verified by inspecting each archive's contents directly; the Windows
# wheel is not a typo-carrying `.dll`), so `library` is the same name on
# both platforms.
[driver.artifacts.linux_amd64]
url = "https://files.pythonhosted.org/packages/6f/26/baa44b8b9faaf26846dd8c0e513c7ce6862d7f35de46ee61175ac976699f/adbc_driver_snowflake-1.11.0-py3-none-manylinux1_x86_64.manylinux_2_28_x86_64.manylinux_2_5_x86_64.whl"
sha256 = "7c7d7ecef7246303648a08cee3d78c383133bea8f2e1568cf6e8750ab94b5a57"
library = "adbc_driver_snowflake/libadbc_driver_snowflake.so"

[driver.artifacts.windows_amd64]
url = "https://files.pythonhosted.org/packages/e9/ca/542793fc9a164f013e3248061e922ac5d5246ce93718a5c0cb44bbd2219e/adbc_driver_snowflake-1.11.0-py3-none-win_amd64.whl"
sha256 = "83b1a363a44ae4cb1e4956f9cc6c4e44dddd7c768a0f0a8b42d9cb8eb8906305"
library = "adbc_driver_snowflake/libadbc_driver_snowflake.so"

[[driver]]
id = "bigquery"
name = "Google BigQuery"
family = "bigquery"
manifest-name = "bigquery"
entrypoint = "AdbcDriverInit"

# Same shape as Snowflake above: official `apache/arrow-adbc` driver,
# wheel-distributed, `.so`-suffixed library on both platforms.
[driver.artifacts.linux_amd64]
url = "https://files.pythonhosted.org/packages/9e/0a/ce0b0772f479eb451993ed9a0d139fcdaddcab651d1ce09520003163aa54/adbc_driver_bigquery-1.11.0-py3-none-manylinux1_x86_64.manylinux_2_28_x86_64.manylinux_2_5_x86_64.whl"
sha256 = "3067b90ccbb6801936567bddcc56e79540efb7e09023f0300e9f6090cb7245e1"
library = "adbc_driver_bigquery/libadbc_driver_bigquery.so"

[driver.artifacts.windows_amd64]
url = "https://files.pythonhosted.org/packages/f2/41/595bdc39a6e8eea2be3ccd043a10e68243b8a682d45f52b5d982674269f3/adbc_driver_bigquery-1.11.0-py3-none-win_amd64.whl"
sha256 = "75ff98aa9071707419c300f9da74e19da375cd6524ecf09493c8131960e31c3c"
library = "adbc_driver_bigquery/libadbc_driver_bigquery.so"

[[driver]]
id = "mssql"
name = "Microsoft SQL Server"
family = "mssql"
manifest-name = "mssql"
entrypoint = "AdbcDriverInit"
install-hint = "No ADBC driver for SQL Server is published by apache/arrow-adbc or on PyPI/crates.io/GitHub Releases as of this spike. Use db-driver-odbc (F8.2) with the \"ODBC Driver 18 for SQL Server\" instead."

[[driver]]
id = "clickhouse"
name = "ClickHouse"
family = "clickhouse"
manifest-name = "clickhouse"
entrypoint = "AdbcDriverInit"
install-hint = "No stable, checksummed ADBC shared-library release for ClickHouse was found (only unofficial/unmaintained third-party packages, e.g. \"adbclick\" on PyPI, with no reproducible release process). Use ClickHouse's ODBC driver through db-driver-odbc (F8.2) instead."

[[driver]]
id = "trino"
name = "Trino"
family = "trino"
manifest-name = "trino"
entrypoint = "AdbcDriverInit"
install-hint = "No ADBC driver for Trino is published; apache/arrow-adbc's Flight SQL driver (adbc-driver-flightsql) only helps if a Flight SQL gateway sits in front of Trino, which is not a given deployment. Use Trino's JDBC-via-ODBC bridge or a future db-sql HTTP-based Trino client instead."
