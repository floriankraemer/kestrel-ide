[workspace]
resolver = "2"
members = [
    "crates/editor-core",
    "crates/project-model",
    "crates/syntax-core",
    "crates/edit-ops",
    "crates/app-config",
    "crates/mcp-server",
    "crates/pty-core",
    "crates/terminal-core",
    "crates/index-core",
    "crates/diagnostics-core",
    "crates/analysis-core",
    "crates/test-core",
    "crates/lsp-core",
    "crates/ai-chat-core",
    "crates/plugin-api",
    "crates/icon-theme",
    "crates/plugin-host",
    "crates/settings-model",
    "crates/markdown-preview",
    "crates/vcs-core",
    "crates/process-exec",
    "crates/run-core",
    "crates/build-core",
    "crates/stdio-framing",
    "crates/dap-core",
    "crates/app-core",
    "crates/ui-shell",
    "crates/app",
    "crates/e2e",
]

# Debug builds link a ~300 MB binary on every incremental cycle; full DWARF is
# the bulk of it. line-tables-only keeps file/line in backtraces and drops the
# variable/type information a debugger would want, and unpacked debuginfo lets
# the linker leave existing object debug data alone instead of copying it.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

# For actually attaching a debugger — mainly to the cxx-qt seam, where
# variable and type information is the whole point. `dev` deliberately
# doesn't carry it: full DWARF costs ~7s on every edit-one-cpp-file cycle
# and doubles target/ (3.5 GB -> 6.9 GB), which is a bad default for a loop
# you run all day and a debugger you attach occasionally.
#   cargo build --profile debugging -p app
[profile.debugging]
inherits = "dev"
debug = true
# Not inherited from dev: "unpacked" leaves the Rust DWARF in .dwo files
# beside the objects, so a binary copied out of the container debugs
# without symbols. This profile exists to be debugged, sometimes
# elsewhere, so it carries its own.
split-debuginfo = "off"
