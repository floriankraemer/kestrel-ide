[package]
name = "settings-model"
version = "0.1.0"
edition = "2021"

[dependencies]
app-config = { path = "../app-config" }
# The editing rules resolve into the very types the editing crates take:
# `edit_ops::IndentStyle` and `editor_core::SaveRules`. Naming them here is
# what lets the view pass one resolved value straight through instead of
# unpacking it into loose arguments at the seam.
edit-ops = { path = "../edit-ops" }
editor-core = { path = "../editor-core" }
syntax-core = { path = "../syntax-core" }
lsp-core = { path = "../lsp-core" }
# The Plugins page joins persisted settings to what the host loaded and what
# the sandbox stopped, exactly as the Languages page joins them to
# `syntax-core`'s runtime — see the module docs of `plugins`.
plugin-api = { path = "../plugin-api" }
plugin-host = { path = "../plugin-host" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tree-sitter = "0.26"

[dev-dependencies]
# Tests only: the regression guard that this crate's provider catalogue
# still agrees with `ai-chat-core`'s, which is the one that actually
# builds the requests. Deliberately not a normal dependency (the two
# vocabularies are kept separate per ADR-0017) — a dev-dependency is
# invisible to `cargo tree -e normal`, the same trick ADR-0018 uses to
# put lsp-core's language guard next to the code it guards.
ai-chat-core = { path = "../ai-chat-core" }
tempfile = "3"
