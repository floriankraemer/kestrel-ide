# Hand-written, like builtin/csharp/plugin.toml: no upstream package to
# import here either, so there is no generator script to re-run. It
# contributes two `analyzers` and one `test-frameworks` row rather than a
# `[wasm]` component — PHPStan, PHPCS and PHPUnit are all native processes
# the host launches by argv, matching `AnalyzerContribution`'s and
# `TestFrameworkContribution`'s doc comments (a wasm guest can neither spawn
# a process nor be trusted with either kind of tool's raw bytes).
#
# Composer-specific detection details (the `.phar`/`.bat` fallback shapes)
# live in `analysis-core` (C2/D7): this manifest lists the candidates and
# the `composer-package` behind "declared but not installed",
# `analysis_core::detect` does the probing — reused for the test framework
# row too, not duplicated (the PHP tooling plan's D7).
id = "php-tools"
name = "PHP Tools"
version = "1.0.0"
api_version = 1
license = "MIT"
description = "PHPStan, Psalm, PHPMD, PHP_CodeSniffer, PHPUnit and the php-cs-fixer, Pint and phpcbf formatters, and live templates for PHP projects."

# The Composer dock (PHP parity plan, I8). `composer` is the id
# `tool_window_factories.cpp` has a native host for.
[[contributes.tool-windows]]
id = "composer"
title = "Composer"
area = "right"

[[contributes.analyzers]]
id = "phpstan"
name = "PHPStan"
# `vendor/bin/phpstan` is what `composer require --dev phpstan/phpstan`
# installs; `phpstan.phar` is the manually-downloaded PHAR some projects
# commit instead; a bare `phpstan` covers a global install on PATH. The
# Windows `vendor/bin/phpstan.bat` shim needs no candidate of its own —
# `analysis_core::detect::find_program` already retries any path-shaped
# candidate with a `.bat` suffix.
program-candidates = ["vendor/bin/phpstan", "phpstan.phar", "phpstan"]
args = ["analyse", "--error-format=checkstyle", "--no-progress"]
output-format = "checkstyle-xml"
composer-package = "phpstan/phpstan"
requires-interpreter = "php"
languages = ["php"]
# PHPStan reads only files on disk, so an unsaved buffer downgrades On Type
# to On Save.
buffer = "saved-only"
# PHPStan's checkstyle `source` is the error identifier.
suppress-comment = "// @phpstan-ignore {code}"

# Quirk: PHPStan's checkstyle report emits every finding as `<error
# severity="error">` — PHPStan has no notion of a "warning" level distinct
# from an error, every rule violation at every level is reported the same
# way. The map therefore only ever sees the word "error"; leaving "warning"
# unmapped is not a gap, `AnalyzerDef::severity_for` never receives that word
# from this tool.
[contributes.analyzers.severity-map]
error = "error"

[[contributes.analyzers]]
id = "phpcs"
name = "PHP_CodeSniffer"
# Same shape as phpstan's candidates: `vendor/bin/phpcs` from
# `composer require --dev squizlabs/php_codesniffer`, `phpcs.phar` as the
# manually-downloaded fallback, `phpcs` for a global install.
program-candidates = ["vendor/bin/phpcs", "phpcs.phar", "phpcs"]
args = ["--report=checkstyle"]
output-format = "checkstyle-xml"
composer-package = "squizlabs/php_codesniffer"
requires-interpreter = "php"
languages = ["php"]
# PHPCS lints the buffer from stdin; `--stdin-path` keeps the file's own
# ruleset matching and reports it under its real path.
buffer = "stdin"
file-args = ["--stdin-path={file}", "-"]
suppress-comment = "// phpcs:ignore {code}"
# `phpcbf --sniffs=<sniff>` fixes one finding's rule.
fixer = "phpcbf"

# Unlike PHPStan, PHPCS's checkstyle report does distinguish `error` from
# `warning` (a sniff can be configured at either severity), so both words are
# mapped.
[contributes.analyzers.severity-map]
error = "error"
warning = "warning"

[[contributes.analyzers]]
id = "psalm"
name = "Psalm"
program-candidates = ["vendor/bin/psalm", "psalm.phar", "psalm"]
args = ["--output-format=checkstyle", "--no-progress"]
output-format = "checkstyle-xml"
composer-package = "vimeo/psalm"
requires-interpreter = "php"
languages = ["php"]
# Psalm analyses files on disk (it needs a psalm.xml in the project).
buffer = "saved-only"
# Psalm's checkstyle report has no `source`; the issue type leads the
# message (`UndefinedVariable: ...`).
code-in-message = true
suppress-comment = "/** @psalm-suppress {code} */"

# Psalm's checkstyle report uses `error` and `info`.
[contributes.analyzers.severity-map]
error = "error"
info = "information"

[[contributes.analyzers]]
id = "phpmd"
name = "PHPMD"
program-candidates = ["vendor/bin/phpmd", "phpmd.phar", "phpmd"]
# PHPMD's argv is positional: `<path> <format> <ruleset> [options]`, so the
# path is the `{file}` placeholder (the file, or the project root for a
# project run). The ruleset is PHPMD's built-in set, not the project's
# `phpmd.xml`.
args = [
  "{file}",
  "checkstyle",
  "cleancode,codesize,controversial,design,naming,unusedcode",
  "--exclude",
  "*/vendor/*,*/node_modules/*",
]
output-format = "checkstyle-xml"
composer-package = "phpmd/phpmd"
requires-interpreter = "php"
languages = ["php"]
buffer = "saved-only"

[contributes.analyzers.severity-map]
error = "warning"
warning = "warning"

# The frameworks below build on (or beside) PHPUnit, so selection order
# matters: `test_core::select_framework` takes the first whose program
# resolves. Pest and Codeception both depend on `phpunit/phpunit`, so they
# precede it; Behat and PHPSpec do not, so a project that has PHPUnit too
# keeps running PHPUnit.
[[contributes.test-frameworks]]
id = "pest"
name = "Pest"
program-candidates = ["vendor/bin/pest"]
# Pest (2+) speaks PHPUnit's `--teamcity` and `--filter`.
args = ["--teamcity"]
filter-flag = "--filter"
output-format = "teamcity"
config-file-candidates = ["phpunit.xml", "phpunit.xml.dist", "pest.php"]
# A coverage run writes Clover XML to a project-relative path, so it lands
# in the project mount whether PHP runs here, in WSL or in a container.
coverage-args = ["--coverage-clover", "$COVERAGE_FILE$"]
composer-package = "pestphp/pest"
requires-interpreter = "php"

[[contributes.test-frameworks]]
id = "codeception"
name = "Codeception"
program-candidates = ["vendor/bin/codecept"]
# `--xml` writes `report.xml` into the configured output directory
# (`tests/_output` by default); there is no streaming format.
args = ["run", "--xml"]
# Codeception has no `--filter`: it selects a test as `file:^method$`, and the
# report does not name the file, so only an editor run can be narrowed. The
# flag is the manifest's mandatory placeholder.
filter-flag = "--filter"
filter-dialect = "codeception"
output-format = "junit-xml"
report-glob = "**/_output/report.xml"
config-file-candidates = ["codeception.yml", "codeception.dist.yml"]
composer-package = "codeception/codeception"
requires-interpreter = "php"

[[contributes.test-frameworks]]
id = "behat"
name = "Behat"
program-candidates = ["vendor/bin/behat"]
# The junit formatter writes one `<suite>.xml` per suite into `--out`.
args = ["--format=junit", "--out=.ide/local/test-reports/behat"]
# Behat selects scenarios by title, not by PHPUnit-style class name.
filter-flag = "--name"
filter-dialect = "behat-name"
output-format = "junit-xml"
report-glob = ".ide/local/test-reports/behat/*.xml"
config-file-candidates = ["behat.yml", "behat.yml.dist"]
composer-package = "behat/behat"
requires-interpreter = "php"

[[contributes.test-frameworks]]
id = "phpspec"
name = "PHPSpec"
program-candidates = ["vendor/bin/phpspec"]
# Without `--out` the junit formatter prints the whole document on stdout.
args = ["run", "--format=junit", "--no-interaction"]
# PHPSpec has no name filter (it selects by spec path); the flag is the
# manifest's mandatory placeholder, and the `none` dialect makes a rerun of a
# single node refuse with a message instead of passing it.
filter-flag = "--example"
filter-dialect = "none"
output-format = "junit-xml-stdout"
config-file-candidates = ["phpspec.yml", "phpspec.yml.dist"]
composer-package = "phpspec/phpspec"
requires-interpreter = "php"

[[contributes.test-frameworks]]
id = "phpunit"
name = "PHPUnit"
# Same candidate shape as the two analyzers above: `vendor/bin/phpunit` from
# `composer require --dev phpunit/phpunit`, `phpunit.phar` as the
# manually-downloaded fallback, `phpunit` for a global install. The Windows
# `.bat` shim needs no candidate of its own for the same reason PHPStan's
# doesn't (`analysis_core::detect::find_program`'s automatic retry).
program-candidates = ["vendor/bin/phpunit", "phpunit.phar", "phpunit"]
# `--teamcity` streams one service message per suite/test as it runs (D2),
# which is what lets the Tests dock's tree fill in while the run is still
# going — see ADR-0048 for why this is preferred over `--log-junit` alone.
# PHPUnit supports `--teamcity` directly, so there is no fallback argv to
# add here; `--log-junit` stays test-core's fallback *parser* for a future
# framework whose manifest names no streaming format, not something this
# row needs.
args = ["--teamcity"]
# PHPUnit's own `--filter` is a regex tested against a test's fully
# qualified name (`Namespace\Class::method`) — precisely the qualified form
# `test_core::TestId` already builds from nested `testSuiteStarted`/
# `testStarted` messages, so no translation happens at the filter call site
# (`test_core::filter`).
filter-flag = "--filter"
output-format = "teamcity"
config-file-candidates = ["phpunit.xml", "phpunit.xml.dist"]
# A coverage run writes Clover XML to a project-relative path, so it lands
# in the project mount whether PHP runs here, in WSL or in a container.
coverage-args = ["--coverage-clover", "$COVERAGE_FILE$"]
composer-package = "phpunit/phpunit"
requires-interpreter = "php"

# Formatters (ADR-0070). A `temp-copy` tool rewrites a copy of the buffer
# beside the original (a dotfile that keeps the `.php` extension), which is
# read back; a `stdin` tool prints the formatted text.
[[contributes.formatters]]
id = "php-cs-fixer"
name = "PHP CS Fixer"
languages = ["php"]
program-candidates = ["vendor/bin/php-cs-fixer", "php-cs-fixer.phar", "php-cs-fixer"]
# `--using-cache=no` keeps a one-file run from reading or writing
# `.php-cs-fixer.cache`; without a config file it applies @PSR12.
args = ["fix", "--using-cache=no", "--quiet", "{file}"]
buffer = "temp-copy"
config-file-candidates = [".php-cs-fixer.php", ".php-cs-fixer.dist.php"]
composer-package = "friendsofphp/php-cs-fixer"
requires-interpreter = "php"

[[contributes.formatters]]
id = "pint"
name = "Laravel Pint"
languages = ["php"]
program-candidates = ["vendor/bin/pint", "pint.phar", "pint"]
args = ["--quiet", "{file}"]
buffer = "temp-copy"
config-file-candidates = ["pint.json"]
composer-package = "laravel/pint"
requires-interpreter = "php"

[[contributes.formatters]]
id = "phpcbf"
name = "PHP Code Beautifier (phpcbf)"
languages = ["php"]
program-candidates = ["vendor/bin/phpcbf", "phpcbf.phar", "phpcbf"]
# `-q` silences the progress output so stdout is only the fixed source;
# `--stdin-path` keeps the file's own ruleset matching.
args = ["-q", "--stdin-path={file}", "-"]
buffer = "stdin"
# 0 = nothing to fix, 1 = everything fixable was fixed, 2 = fixed what it
# could and some violations remain. All three print the resulting source.
success-exit-codes = [0, 1, 2]
fix-args = ["--sniffs={sniff}"]
config-file-candidates = [".phpcs.xml", "phpcs.xml", ".phpcs.xml.dist", "phpcs.xml.dist"]
composer-package = "squizlabs/php_codesniffer"
requires-interpreter = "php"

# Live templates (ADR-0072). Bodies are LSP snippets: `$1`, `${1:default}`, `$0`,
# `$SELECTION$` (surround) and, for postfix, `$EXPR$`; a PHP variable's dollar is
# written `\$` so the snippet grammar leaves it alone.
[[contributes.live-templates]]
language = "php"
abbreviation = "fore"
description = "foreach over a value"
body = "foreach (\\$${1:array} as \\$${2:item}) {\n\t$SELECTION$$0\n}"
context = "statement"

[[contributes.live-templates]]
language = "php"
abbreviation = "forek"
description = "foreach with key and value"
body = "foreach (\\$${1:array} as \\$${2:key} => \\$${3:value}) {\n\t$SELECTION$$0\n}"
context = "statement"

[[contributes.live-templates]]
language = "php"
abbreviation = "if"
description = "if statement"
body = "if (${1:condition}) {\n\t$SELECTION$$0\n}"
context = "statement"

[[contributes.live-templates]]
language = "php"
abbreviation = "ife"
description = "if / else statement"
body = "if (${1:condition}) {\n\t$SELECTION$$2\n} else {\n\t$0\n}"
context = "statement"

[[contributes.live-templates]]
language = "php"
abbreviation = "try"
description = "try / catch block"
body = "try {\n\t$SELECTION$$1\n} catch (\\Throwable \\$${2:e}) {\n\t$0\n}"
context = "statement"

[[contributes.live-templates]]
language = "php"
abbreviation = "fn"
description = "function"
body = "function ${1:name}($2): ${3:void}\n{\n\t$0\n}"
context = "statement"

[[contributes.live-templates]]
language = "php"
abbreviation = "pubf"
description = "public method"
body = "public function ${1:name}($2): ${3:void}\n{\n\t$0\n}"
context = "class"

[[contributes.live-templates]]
language = "php"
abbreviation = "prif"
description = "private method"
body = "private function ${1:name}($2): ${3:void}\n{\n\t$0\n}"
context = "class"

[[contributes.live-templates]]
language = "php"
abbreviation = "prof"
description = "protected method"
body = "protected function ${1:name}($2): ${3:void}\n{\n\t$0\n}"
context = "class"

[[contributes.live-templates]]
language = "php"
abbreviation = "pubsf"
description = "public static method"
body = "public static function ${1:name}($2): ${3:void}\n{\n\t$0\n}"
context = "class"

[[contributes.live-templates]]
language = "php"
abbreviation = "const"
description = "constant"
body = "const ${1:NAME} = ${2:null};$0"

[[contributes.live-templates]]
language = "php"
abbreviation = "ctor"
description = "constructor with promoted properties"
body = "public function __construct(\n\t${1:private readonly string \\$name},\n) {\n\t$0\n}"
context = "class"

[[contributes.live-templates]]
language = "php"
abbreviation = "dd"
description = "var_dump and die"
body = "var_dump(${1:\\$var});\ndie();$0"
context = "statement"

[[contributes.live-templates]]
language = "php"
abbreviation = "vd"
description = "var_dump"
body = "var_dump(${1:\\$var});$0"
context = "statement"

[[contributes.live-templates]]
language = "php"
abbreviation = "if"
description = "if (expr)"
body = "if ($EXPR$) {\n\t$0\n}"
postfix = true

[[contributes.live-templates]]
language = "php"
abbreviation = "notnull"
description = "if (expr !== null)"
body = "if ($EXPR$ !== null) {\n\t$0\n}"
postfix = true

[[contributes.live-templates]]
language = "php"
abbreviation = "null"
description = "if (expr === null)"
body = "if ($EXPR$ === null) {\n\t$0\n}"
postfix = true

[[contributes.live-templates]]
language = "php"
abbreviation = "isset"
description = "if (isset(expr))"
body = "if (isset($EXPR$)) {\n\t$0\n}"
postfix = true

[[contributes.live-templates]]
language = "php"
abbreviation = "foreach"
description = "foreach (expr as $item)"
body = "foreach ($EXPR$ as \\$${1:item}) {\n\t$0\n}"
postfix = true

[[contributes.live-templates]]
language = "php"
abbreviation = "return"
description = "return expr;"
body = "return $EXPR$;"
postfix = true

[[contributes.live-templates]]
language = "php"
abbreviation = "var"
description = "$name = expr;"
body = "\\$${1:name} = $EXPR$;$0"
postfix = true

[[contributes.live-templates]]
language = "php"
abbreviation = "throw"
description = "throw expr;"
body = "throw $EXPR$;"
postfix = true

[[contributes.live-templates]]
language = "php"
abbreviation = "par"
description = "(expr)"
body = "($EXPR$)"
postfix = true
